name: Verify and deploy GEM Classic PWA
on:
  push:
    branches: [main, gem-classic-pwa-release]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gem-classic-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PDF.js and Playwright dependencies
        run: npm install --no-save --package-lock=false pdfjs-dist@4.10.38 playwright@1.56.1
      - name: Bundle matching PDF display and worker scripts
        run: |
          mkdir -p vendor
          cp node_modules/pdfjs-dist/build/pdf.min.mjs vendor/pdf.min.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs vendor/pdf.worker.min.mjs
          test -s vendor/pdf.min.mjs
          test -s vendor/pdf.worker.min.mjs
      - name: Build privacy-filtered PWA
        run: |
          node --check app.js
          node --check offline-bridge.js
          node --check pdfjs-adapter.js
          python3 build_hosted_site.py dist
          python3 tests/static_gate.py dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test PDF import, pin persistence and offline reopen
        run: node tests/e2e.cjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
