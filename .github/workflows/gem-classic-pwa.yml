name: GEM Classic PWA release gate
on:
  push:
    branches: [gem-classic-pwa-release, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify full Classic source was imported
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js styles.css offline-bridge.js browser-export.js pdfjs-adapter.js build_hosted_site.py tests/e2e.cjs tests/static_gate.py; do
            if [ ! -s "$f" ]; then echo "::error file=$f::Missing full sanitized GEM Classic application source"; exit 1; fi
          done
      - name: Install pinned PDF.js and Playwright
        run: npm install --no-save --package-lock=false pdfjs-dist@4.10.38 playwright@1.56.1
      - name: Bundle PDF.js local engine and matching worker
        run: |
          mkdir -p vendor
          cp node_modules/pdfjs-dist/build/pdf.min.mjs vendor/pdf.min.mjs
          cp node_modules/pdfjs-dist/build/pdf.worker.min.mjs vendor/pdf.worker.min.mjs
          test -s vendor/pdf.min.mjs && test -s vendor/pdf.worker.min.mjs
      - name: Build verified, privacy-safe PWA
        run: |
          node --check app.js
          node --check offline-bridge.js
          python3 build_hosted_site.py dist
          python3 tests/static_gate.py dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: PDF, pins, photos, save, offline browser acceptance
        run: node tests/e2e.cjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
